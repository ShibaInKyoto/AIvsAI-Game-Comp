name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64 -DGB_BUILD_TESTS=ON -DGB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check runtime dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents build/bin/Gridbreaker.exe
          $deps
          if ($deps -match "VCRUNTIME|MSVCP") { throw "Executable depends on the VC++ redistributable" }

      - name: Smoke test with software OpenGL
        continue-on-error: true
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/24.2.8/mesa3d-24.2.8-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item build/bin/Gridbreaker.exe smoke/
          Copy-Item mesa/x64/*.dll smoke/
          $env:GALLIUM_DRIVER = "llvmpipe"
          $p = Start-Process -FilePath smoke/Gridbreaker.exe -ArgumentList "--windowed","--size","1000x600","--no-audio","--data-dir","smoke/data","--autotest","40","--screenshot","smoke/windows.png","--screenshot-at","30" -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          if (-not (Test-Path smoke/windows.png)) { throw "Smoke test produced no screenshot" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-test
          path: smoke/windows.png
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/Gridbreaker"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/bin/Gridbreaker.exe $dist/
          Copy-Item README.md $dist/README.md
          Copy-Item LICENSE $dist/LICENSE.txt
          New-Item -ItemType Directory -Force $dist/licenses | Out-Null
          Copy-Item assets/fonts/OFL-*.txt $dist/licenses/
          Compress-Archive -Path $dist -DestinationPath dist/Gridbreaker-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Gridbreaker-windows-x64
          path: dist/Gridbreaker-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (GCC) + tests + smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb mesa-utils \
            clang-format-18

      - name: Check formatting (.clang-format)
        run: git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tools/*.cpp' | xargs clang-format-18 --dry-run --Werror

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (bot plays under a virtual display)
        run: |
          mkdir -p smoke
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/bin/Gridbreaker --windowed --size 1280x720 --no-audio --data-dir smoke/data \
            --autotest 90 --screenshot smoke/autotest.png --screenshot-at 60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [windows, linux]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Gridbreaker-windows-x64
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # The project version lives on the "VERSION x.y.z" line of project().
            TAG="v$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/Gridbreaker-windows-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Gridbreaker $TAG" \
            --notes-file docs/RELEASE_NOTES.md

  nightly:
    name: Update rolling nightly build
    needs: [windows, linux]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gridbreaker-windows-x64
          path: dist

      - name: Replace nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/Gridbreaker-windows-x64.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Gridbreaker (latest development build)" \
            --notes "Automatically built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download the zip, extract it and run Gridbreaker.exe."
